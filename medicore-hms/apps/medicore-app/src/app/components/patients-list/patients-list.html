<div style="padding: 0em 2em 0em 2em">
  <div
    style="
      display: flex;
      height: 2.75em;

      border: 1px solid #d0d5dd;
      border-radius: 16px;
      align-items: center;
      padding-left: 1em;
      padding-right: 1em;
    "
  >
    <img src="magnifier.svg" alt="" style="height: 1.5em" />
    <input
      type="text"
      style="width: 100%; outline-style: none; border: none"
      placeholder="Search patient ID, name, record..."
    />
  </div>
  <ag-grid-angular
    class="ag-theme-quartz"
    style="width: 100%; height: 600px"
    [columnDefs]="columnDefs"
    [rowData]="(patients$ | async) ?? []"
    [defaultColDef]="defaultColDef"
  />
</div>
