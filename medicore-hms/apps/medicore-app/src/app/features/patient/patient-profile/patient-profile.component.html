<div class="profile-page">
  <div class="page-header">
    <h1 class="page-title">My Profile</h1>
    <p class="page-subtitle">Update your personal and emergency contact information.</p>
  </div>

  <div class="card">
    @if (errorMsg()) {
      <div class="alert alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMsg() }}
      </div>
    }

    @if (successMsg()) {
      <div class="alert alert-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        {{ successMsg() }}
      </div>
    }

    <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="mc-form form-grid">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" formControlName="firstName" class="form-input" [class.error]="hasError('firstName')">
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input type="text" formControlName="lastName" class="form-input" [class.error]="hasError('lastName')">
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" formControlName="phone" class="form-input" [class.error]="hasError('phone')">
      </div>
      <div class="form-group">
        <label class="form-label">Email (Optional)</label>
        <input type="email" formControlName="email" class="form-input" [class.error]="hasError('email')">
      </div>
      <div class="form-group">
        <label class="form-label">Date of Birth</label>
        <input type="date" formControlName="dateOfBirth" class="form-input" [class.error]="hasError('dateOfBirth')">
      </div>
      <div class="form-group">
        <label class="form-label">Gender</label>
        <select formControlName="gender" class="form-input" [class.error]="hasError('gender')">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Blood Group (Optional)</label>
        <select formControlName="bloodGroup" class="form-input">
          <option value="">Select</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
        </select>
      </div>
      <div class="form-group" style="grid-column: 1 / -1">
        <label class="form-label">Address</label>
        <input type="text" formControlName="address" class="form-input" [class.error]="hasError('address')">
      </div>

      <div class="form-divider" style="grid-column: 1 / -1">Emergency Contact</div>

      <div class="form-group">
        <label class="form-label">Contact Name</label>
        <input type="text" formControlName="emergencyContactName" class="form-input" [class.error]="hasError('emergencyContactName')">
      </div>
      <div class="form-group">
        <label class="form-label">Contact Phone</label>
        <input type="tel" formControlName="emergencyContactPhone" class="form-input" [class.error]="hasError('emergencyContactPhone')">
      </div>

      <div class="form-actions" style="grid-column: 1 / -1">
        <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
          @if (isSaving()) {
            <span class="spinner"></span> Saving...
          } @else {
            Save Changes
          }
        </button>
      </div>
    </form>
  </div>
</div>
