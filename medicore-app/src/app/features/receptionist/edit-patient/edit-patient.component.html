<div class="edit-patient-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Edit Patient Profile</h1>
      <p class="page-subtitle">Update patient information and medical history.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-tertiary" (click)="cancel()">Cancel</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="isLoading()">
        @if(isLoading()) { Saving... } @else { Save Changes }
      </button>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-sections">
      <!-- Basic Details -->
      <div class="card">
        <h3 class="section-title">Personal Details</h3>
        <div class="form-grid">
          <div class="field">
            <label class="field-label">First Name <span class="required">*</span></label>
            <input class="form-input" formControlName="firstName" [class.error]="hasError('firstName')" />
          </div>
          <div class="field">
            <label class="field-label">Last Name <span class="required">*</span></label>
            <input class="form-input" formControlName="lastName" [class.error]="hasError('lastName')" />
          </div>
          <div class="field">
            <label class="field-label">Date of Birth <span class="required">*</span></label>
            <input type="date" class="form-input" formControlName="dateOfBirth" [class.error]="hasError('dateOfBirth')" />
          </div>
          <div class="field">
            <label class="field-label">Gender <span class="required">*</span></label>
            <select class="form-input" formControlName="gender" [class.error]="hasError('gender')">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Contact Info -->
      <div class="card">
        <h3 class="section-title">Contact Information</h3>
        <div class="form-grid">
          <div class="field">
            <label class="field-label">Phone Number <span class="required">*</span></label>
            <input type="tel" class="form-input" formControlName="phone" [class.error]="hasError('phone')" />
          </div>
          <div class="field">
            <label class="field-label">Email Address <span class="required">*</span></label>
            <input type="email" class="form-input" formControlName="email" [class.error]="hasError('email')" />
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label class="field-label">Home Address <span class="required">*</span></label>
            <input class="form-input" formControlName="address" [class.error]="hasError('address')" />
          </div>
        </div>
      </div>

      <!-- Medical Details -->
      <div class="card">
        <h3 class="section-title">Medical Information</h3>
        <div class="form-grid">
          <div class="field">
            <label class="field-label">Blood Group <span class="required">*</span></label>
            <select class="form-input" formControlName="bloodGroup" [class.error]="hasError('bloodGroup')">
              <option value="A+">A+</option><option value="A-">A-</option>
              <option value="B+">B+</option><option value="B-">B-</option>
              <option value="AB+">AB+</option><option value="AB-">AB-</option>
              <option value="O+">O+</option><option value="O-">O-</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label class="field-label">Allergies</label>
            <input class="form-input" formControlName="allergies" placeholder="e.g., Penicillin, Peanuts (or leave blank)" />
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label class="field-label">Medical History</label>
            <textarea class="form-input" formControlName="medicalHistory" placeholder="Past surgeries, chronic conditions..." rows="3"></textarea>
          </div>
        </div>
      </div>

      <!-- Emergency Contact -->
      <div class="card">
        <h3 class="section-title">Emergency Contact</h3>
        <div class="form-grid">
          <div class="field">
            <label class="field-label">Contact Name <span class="required">*</span></label>
            <input class="form-input" formControlName="emergencyContactName" [class.error]="hasError('emergencyContactName')" />
          </div>
          <div class="field">
            <label class="field-label">Contact Phone <span class="required">*</span></label>
            <input type="tel" class="form-input" formControlName="emergencyContactPhone" [class.error]="hasError('emergencyContactPhone')" />
          </div>
        </div>
      </div>

    </div>
  </form>
</div>
