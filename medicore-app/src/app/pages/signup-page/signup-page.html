<div style="" class="form-wrapper">
  <form
    style="
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #00000026;
      gap: 2em;
      padding: 1.5em;
      box-shadow: 0 1px 3px 0 #0000004d;
      align-items: center;
    "
  >
    <p style="margin-right: auto; margin-left: auto" class="title">Sign up for Medi-core</p>
    <!--TODO: Set a Form Control-->
    <div style="display: flex; gap: 1em; width: 100%">
      <div class="inputs firstName">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="John" />
      </div>

      <div class="inputs lastName">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Doe" />
      </div>
    </div>
    <div class="inputs email">
      <label for="emai">Email Address</label>
      <input type="email" id="email" placeholder="Email" />
    </div>
    <div class="inputs password">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="new-password" />
    </div>

    <div class="inputs confirmPassword">
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="new-password"
      />
    </div>
    <p style="text-align: center">OR</p>
    <div style="display: flex; align-items: center; gap: 1em">
      <a href="auth"><img src="google-sign-up.svg" alt="Google Sign Up" style="width: 100%" /></a
      ><span style="color: red; font-weight: bolder">Subject to change</span>
    </div>
    <button class="primary-btn">Sign Up</button>
    <a routerLink="login">Do you already have an account login</a>
  </form>
</div>
